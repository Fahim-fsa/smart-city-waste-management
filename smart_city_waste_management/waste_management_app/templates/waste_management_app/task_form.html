{% extends 'base.html' %}
{% block title %}Assign Task{% endblock %}
{% block content %}
<div class="container-fluid">
    <h4 class="fw-bold mb-4"><i class="bi bi-person-check me-2 text-success"></i>Assign Volunteer Task</h4>
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check me-1"></i>Assign Task</button>
                        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
